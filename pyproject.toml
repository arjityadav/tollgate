[project]
name = "tollgate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arjit", email = "42977377+arjityadav@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
tollgate = "tollgate.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "examples"]
